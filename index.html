<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bible Study Dev</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      max-width: 600px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: #ffffff;
    }
    .subtitle {
      color: #a0a0a0;
      margin-bottom: 2.5rem;
      font-size: 0.95rem;
    }
    .app-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.2rem;
    }
    @media (min-width: 480px) {
      .app-grid { grid-template-columns: 1fr 1fr; }
    }
    .app-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 2rem 1.5rem;
      text-decoration: none;
      color: inherit;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .app-card:hover {
      background: rgba(255,255,255,0.1);
      transform: translateY(-4px);
      border-color: rgba(255,255,255,0.25);
    }
    .app-icon {
      font-size: 2.5rem;
      margin-bottom: 0.8rem;
    }
    .app-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 0.4rem;
    }
    .app-desc {
      font-size: 0.85rem;
      color: #a0a0a0;
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      margin-top: 0.8rem;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
      background: rgba(255,255,255,0.1);
      color: #e0e0e0;
    }
    .badge.live { background: #2d6a4f; color: #d8f3dc; }
    .badge.coming { background: rgba(255,255,255,0.1); color: #a0a0a0; }
    footer {
      margin-top: 3rem;
      font-size: 0.8rem;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📖 Bible Study Dev</h1>
    <p class="subtitle">Biblical languages & software development portfolio</p>

    <div class="app-grid">
      <!-- Greek App（已上線） -->
      <a href="apps/greek-app/GreekApp01_Scripture.html" class="app-card">
        <div class="app-icon">🇬🇷</div>
        <div class="app-title">Greek App</div>
        <div class="app-desc">New Testament scripture selection and parsing tools.</div>
        <span class="badge live">Live</span>
      </a>

      <!-- Hebrew App（未來啟用） -->
      <a href="#" class="app-card" style="opacity: 0.5; pointer-events: none;">
        <div class="app-icon">🇮🇱</div>
        <div class="app-title">Hebrew App</div>
        <div class="app-desc">Old Testament scripture and Hebrew parsing tools.</div>
        <span class="badge coming">Coming Soon</span>
      </a>
    </div>

    <footer>
      © Chris Chi Kong HO · Built with GitHub Pages
    </footer>
  </div>
</body>
</html>
